name: Release from develop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-from-develop
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  prepare:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Require develop branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/develop" ]]; then
            echo "::error::Select the develop branch when running this workflow."
            exit 1
          fi

      - name: Check out selected develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require publishing credentials
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.PUB_DEV_SERVICE_ACCOUNT_KEY }}
        run: |
          if [[ -z "$SERVICE_ACCOUNT_KEY" ]]; then
            echo "::error::Configure PUB_DEV_SERVICE_ACCOUNT_KEY as described in .github/RELEASING.md."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get package dependencies
        run: make get

      - name: Analyze package
        run: make analyze

      - name: Test package
        run: make test

      - name: Validate package publication
        run: flutter pub publish --dry-run

      - name: Create version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' pubspec.yaml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::pubspec.yaml must contain a release version such as 0.5.2 or 0.6.0-beta.1."
            exit 1
          fi
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already points to a different commit. Bump the package version."
              exit 1
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Authenticate service account for pub.dev
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PUB_DEV_SERVICE_ACCOUNT_KEY }}
          token_format: id_token
          id_token_audience: https://pub.dev
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Publish to pub.dev
        env:
          PUB_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          flutter pub token add https://pub.dev --env-var PUB_TOKEN
          flutter pub publish --force

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
