name: Publish tagged package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-tagged-package
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  publish:
    name: Publish package and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Require a version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::This workflow requires a version tag. Run Release from develop to start publication."
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@v4

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' pubspec.yaml)
          if [[ -z "$version" || "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag must match pubspec.yaml version (v$version)."
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get package dependencies
        run: make get

      - name: Analyze package
        run: make analyze

      - name: Test package
        run: make test

      - name: Validate package publication
        run: flutter pub publish --dry-run

      - name: Configure pub.dev OIDC authentication
        uses: dart-lang/setup-dart@v1

      - name: Publish to pub.dev
        run: flutter pub publish --force

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
